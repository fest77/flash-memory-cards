name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - 'dist/md-flashcards.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 纯 Node 单测（零依赖、秒级）：构建前先挡住逻辑回归
      - name: Unit tests
        run: node tests/core.test.cjs

      - name: Build single-file HTML
        run: python scripts/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 已预装 Android SDK（含 cmdline-tools）；setup-android@v3 默认的 tools 包
      # 已被 Google 下架会导致构建失败，改为直接接受许可 + 按需安装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-flashcards-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
